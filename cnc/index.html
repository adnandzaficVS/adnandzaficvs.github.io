document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 600;\n  font-display: swap;\n  src: url(\"b0abf86a-a649-4622-9512-22fe0650cc3e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1p tin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b0abf86a-a649-4622-9512-22fe0650cc3e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#f2f2f3;color:#1d1f20;font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}\na{color:#34536f}a:hover{color:#5980a6}\nbutton:focus-visible,input:focus-visible{outline:2px solid #5980a6;outline-offset:2px}\ninput[type=range]{accent-color:#5980a6}\n::selection{background:#c9d7e6}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1680px;margin:0 auto;padding:{{ pad }};box-sizing:border-box;display:flex;flex-direction:column;gap:{{ gap }}\">\n\n  <header style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid #b8bec5\">\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <div style=\"font:600 13px 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#34536f\">Vanjski prstenovi ležajeva · {{ linesLabel }} · 1 operater<\u002Fdiv>\n      <h1 style=\"margin:0;font:600 {{ h1 }}/1 'Barlow Condensed',sans-serif;letter-spacing:.01em;text-wrap:pretty\">Robotske ćelije OP1 / OP2 u liniji<\u002Fh1>\n      <div style=\"font:400 16px 'Barlow',sans-serif;color:#4a4f54;max-width:760px;text-wrap:pretty\">Kolaborativni 6-osni robot s duplom centričnom hvataljkom (hvat izvana i iznutra), stanica za pregrip i okretni stol sa štapovima — sve na jednoj prenosivoj platformi između OP1 i OP2. Jedan operater opslužuje sve stolove i korpe; između slojeva gotovih komada stavlja plavi papir.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n      <div style=\"font:600 13px 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#34536f\">Vrijeme simulacije<\u002Fdiv>\n      <div style=\"font:600 {{ h1 }}/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums\">{{ clock }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n    <button sc-camel-on-click=\"{{ togglePlay }}\" style=\"position:relative;min-width:120px;background:#5980a6;color:#ffffff;border:1px solid #5980a6;border-radius:0;padding:10px 20px;font:600 17px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#4b7197;border-color:#4b7197\">\n      <span style=\"position:absolute;top:-5px;left:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <span style=\"position:absolute;top:-5px;right:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <span style=\"position:absolute;bottom:-5px;left:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <span style=\"position:absolute;bottom:-5px;right:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      {{ playLabel }}\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ reset }}\" style=\"background:transparent;color:#1d1f20;border:1px solid #b8bec5;border-radius:0;padding:10px 16px;font:600 17px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer\" style-hov (#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <span style=\"position:absolute;top:-5px;right:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <span style=\"position:absolute;bottom:-5px;left:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <span style=\"position:absolute;bottom:-5px;right:-5px;width:9px;height:9px;background:linear-gradient(#1d1f20,#1d1f20) center/1px 100% no-repeat,linear-gradient(#1d1f20,#1d1f20) center/100% 1px no-repeat;pointer-events:none\"><\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #b8bec5\">\n        <span style=\"font:600 20px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase\">Parametri<\u002Fspan>\n        <span style=\"font:400 14px 'Barlow',sans-serif;color:#5b6168\">vremena važe od sljedećeg ciklusa<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px;padding:14px\">\n        <sc-for list=\"{{ sliders }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <label style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"display:flex;justify-content:space-between;gap:8px;font:500 15px 'Barlow',sans-serif\"><span>{{ f.label }}<\u002Fspan><span style=\"font:600 17px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums\">{{ f.display }}<\u002Fspan><\u002Fspan>\n            <input type=\"range\" min=\"{{ f.min }}\" max=\"{{ f.max }}\" step=\"{{ f.step }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"width:100%;margin:4px 0\">\n          <\u002Flabel>\n        <\u002Fsc-for>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:500 15px 'Barlow',sans-serif\">Broj linija (1 operater)<\u002Fspan>\n          <div style=\"display:flex;border:1px solid #b8bec5;align-self:flex-start\">\n            <sc-for list=\"{{ lineOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:0;border-radius:0;padding:7px 12px;font:600 16px 'Barlow Condensed',sans-serif;cursor:pointer;font-variant-numeric:tabular-nums\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:500 15px 'Barlow',sans-serif\">Slojeva u korpi (24 kom/sloj)<\u002Fspan>\n          <div style=\"display:flex;border:1px solid #b8bec5;align-self:flex-start\">\n            <sc-for list=\"{{ layerOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:0;border-radius:0;padding:7px 12px;font:600 16px 'Barlow Condensed',sans-serif;cursor:pointer;font-variant-numeric:tabular-nums\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:500 15px 'Barlow',sans-serif\">Štapova po strani stola<\u002Fspan>\n          <div style=\"display:flex;border:1px solid #b8bec5;align-self:flex-start\">\n            <sc-for list=\"{{ pinOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:0;border-radius:0;padding:7px 14px;font:600 16px 'Barlow Condensed',sans-serif;cursor:pointer\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:500 15px 'Barlow',sans-serif\">Obruča po štapu<\u002Fspan>\n          <div style=\"display:flex;border:1px solid #b8bec5;align-self:flex-start\">\n            <sc-for list=\"{{ stackOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"background:{{ o.bg }};color:{{ o.fg }};border:0;border-radius:0;padding:7px 12px;font:600 16px 'Barlow Condensed',sans-serif;cursor:pointer;font-variant-numeric:tabular-nums\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:0 14px 14px;font:400 14px 'Barlow',sans-serif;color:#4a4f54;text-wrap:pretty\">Jedan štap po strani ostaje prazan za gotove komade. Linije startaju pomjereno (različito popunjeni stolovi), kao u stvarnom radu. Hod operatera 1,1 m/s, razmak linija 6,7 m. Promjena broja linija, slojeva, štapova ili stoga resetuje simulaciju.<\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showReach&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ganttMinutes&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;5&quot;,&quot;10&quot;,&quot;20&quot;],&quot;default&quot;:&quot;10&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { playing: true, speed: 20, view: '3d', focus: -1, showReach: null, params: null, snap: null, err: null };\n  r2d = React.createRef(); r3d = React.createRef(); rG = React.createRef();\n  KEY = 'robocell-params-v2';\n\n  componentDidMount() {\n    this.onResize = () => { const vw = window.innerWidth; if (vw !== this.state.vw) this.setState({ vw }); };\n    window.addEventListener('resize', this.onResize); this.onResize();\n    try { this.saved = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { this.saved = null; }\n    this.boot();\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf); clearInterval(this.iv); window.removeEventListener('resize', this.onResize);\n    if (this.v3) this.v3.dispose();\n  }\n  loadScript(src) {\n    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('nije moguće učitati ' + src)); document.head.appendChild(s); });\n  }\n  async boot() {\n    try {\n      for (let i = 0; i < 60 && !(window.CellSim && window.CellSim.setParams); i++) await new Promise(r => setTimeout(r, 50));\n      if (!window.CellSim || !window.CellSim.setParams) await this.loadScript('cell-sim.js?v=4');\n      const CS = this.CS = window.CellSim;\n      const params = Object.assign({}, CS.DEF, this.saved || {});\n      this.sim = CS.create(params);\n      this.cv2 = document.createElement('canvas'); this.cv2.style.cssText = 'display:block;width:100%;height:100%';\n      this.r2d.current.appendChild(this.cv2);\n      this.cvG = document.createElement('canvas'); this.cvG.style.cssText = 'display:block;width:100%;height:100%';\n      this.rG.current.appendChild(this.cvG);\n      this.setState({ params, snap: CS.snapshot(this.sim) });\n      this.last = performance.now();\n      this.raf = requestAnimationFrame(this.frame);\n      this.iv = setInterval(() => this.ui(), 250);\n      try { await document.fonts.ready; } catch (e) {}\n      try {\n        for (let i = 0; i < 100 && !(window.THREE && window.THREE.OrbitControls); i++) await new Promise(r => setTimeout(r, 50));\n        if (!window.THREE) await this.loadScript('https://unpkg.com/three@0.147.0/build/three.min.js');\n        if (!window.THREE.OrbitControls) await this.loadScript('https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js');\n        this.v3 = CS.create3D(this.r3d.current, this.sim);\n      } catch (e) { this.setState({ err: String(e.message || e) }); }\n    } catch (e) { this.setState({ err: String(e.message || e) }); }\n  }\n  fit(cv, el) {\n    const w = el.clientWidth, h = el.clientHeight, d = Math.min(2, window.devicePixelRatio || 1);\n    if (!w || !h) return null;\n    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }\n    const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0); return { ctx, w, h };\n  }\n  isMob() { return (this.state.vw || window.innerWidth) < 700; }\n  reachOn() { return this.state.showReach ?? (this.props.showReach ?? true); }\n  ganttLine() { const f = this.state.focus; return f >= 0 ? f : 0; }\n  frame = (now) => {\n    const dt = Math.min(0.1, (now - this.last) / 1000); this.last = now;\n    if (this.state.playing) this.CS.tick(this.sim, dt * this.state.speed);\n    const f = this.r2d.current && this.fit(this.cv2, this.r2d.current);\n    if (f) this.CS.draw2D(f.ctx, this.sim, f.w, f.h, { showReach: this.reachOn(), focus: this.state.focus, stack: this.isMob() });\n    const el = this.r3d.current;\n    if (this.v3 && el && el.clientWidth) { this.v3.resize(el.clientWidth, el.clientHeight); this.v3.update(this.sim, { showReach: this.reachOn(), autoRotate: this.props.autoRotate ?? false }); }\n    this.raf = requestAnimationFrame(this.frame);\n  };\n  ui() {\n    this.setState({ snap: this.CS.snapshot(this.sim) });\n    const g = this.rG.current && this.fit(this.cvG, this.rG.current);\n    if (g) this.CS.drawGantt(g.ctx, this.sim, this.ganttLine(), g.w, g.h, (Number(this.props.ganttMinutes) || 10) * 60);\n  }\n  resetWith(params, reframe) {\n    if (!this.CS) return;\n    this.sim = this.CS.create(params);\n    if (this.v3) { const cam = reframe ? null : this.v3.camState(); this.v3.dispose(); this.v3 = this.CS.create3D(this.r3d.current, this.sim, cam); }\n    this.setState({ snap: this.CS.snapshot(this.sim) });\n  }\n  setParam(k, v) {\n    const params = Object.assign({}, this.state.params, { [k]: v });\n    try { localStorage.setItem(this.KEY, JSON.stringify(params)); } catch (e) {}\n    const st = { params };\n    if (k === 'lines' && this.state.focus >= v) st.focus = -1;\n    this.setState(st);\n    if (['pins', 'stack', 'lines', 'layers'].includes(k)) this.resetWith(params, k === 'lines');\n    else if (this.sim) this.CS.setParams(this.sim, params);\n  }\n  setFocus(i) {\n    this.setState({ focus: i });\n    if (this.v3) this.v3.preset(i < 0 ? 'all' : 'iso', i);\n  }\n\n  renderVals() {\n    const s = this.state, sn = s.snap, p = s.params || (window.CellSim ? window.CellSim.DEF : { op1: 55, op2: 45, speed: 100, opTime: 3, rot: 5, pins: 4, stack: 10, lines: 3, paperT: 5, basketT: 45, layers: 8 });\n    const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, x = t % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };\n    const seg = (active, onClick, label) => ({ label, onClick, bg: active ? '#34536f' : 'transparent', fg: active ? '#ffffff' : '#1d1f20' });\n    const pct = v => Math.round((v || 0) * 100);\n    const plural = n => n === 1 ? ' linija' : (n >= 2 && n <= 4 ? ' linije' : ' linija');\n    const reach = this.reachOn();\n    const vw = s.vw || 1200, mob = vw < 700, cw = Math.min(vw, 1680) - (mob ? 26 : 58);\n    const gm = Number(this.props.ganttMinutes) || 10;\n    const N = sn ? sn.N : (p.lines || 3);\n    const gl = Math.min(this.ganttLine(), N - 1);\n    const L = sn ? sn.lines[gl] : null;\n    const load = sn && sn.nMax ? N / sn.nMax : null;\n    const kpis = sn ? [\n      { label: 'Gotovih komada', value: String(sn.produced), unit: 'kom', w: Math.min(100, sn.produced / Math.max(1, sn.perSide * N) * 100) + '%', sub: N + plural(N) + ' · strana stola ' + sn.perSide + ' kom' },\n      { label: 'Učinak ukupno', value: sn.uph ? sn.uph.toFixed(0) : '—', unit: 'kom/h', w: sn.uph ? Math.min(100, sn.uph / (N * 70) * 100) + '%' : '0%', sub: L && L.takt ? 'takt L' + (gl + 1) + ': ' + L.takt.toFixed(1) + ' s/kom' : 'mjerenje nakon 3 gotova komada po liniji' },\n      { label: 'Operater zauzet', value: String(pct(sn.opUtil)), unit: '%', w: pct(sn.opUtil) + '%', sub: 'od toga hodanje ' + pct(sn.walkShare) + '% vremena' },\n      { label: 'Roboti čekaju operatera', value: (sn.waitPct * 100).toFixed(1), unit: '%', w: Math.min(100, sn.waitPct * 500) + '%', sub: 'ukupno ' + fmt(sn.waitOp) + ' zastoja na svim linijama' },\n      { label: 'Kapacitet 1 operatera', value: sn.nMax ? sn.nMax.toFixed(1) : '—', unit: 'linija', w: load ? Math.min(100, load * 100) + '%' : '0%', sub: sn.nMax ? 'opterećenje ' + Math.round(load * 100) + '% · rad po strani stola ' + (sn.wSide / 60).toFixed(1) + ' min · autonomija ' + (sn.tSide / 60).toFixed(0) + ' min' : 'procjena nakon ~8 gotovih komada' },\n      { label: 'Korpe · plavi papir', value: String(sn.swaps), unit: 'zamjena', w: L ? Math.min(100, L.fin / sn.cap * 100) + '%' : '0%', sub: 'papira postavljeno: ' + sn.papers + ' · korpa ' + sn.cap + ' kom (' + p.layers + ' × 24)' },\n    ] : [];\n    const rows = sn ? sn.lines.map((l, i) => {\n      const on = s.focus === i;\n      return { name: 'L' + (i + 1), onClick: () => this.setFocus(on ? -1 : i), bg: on ? '#34536f' : 'transparent', fg: on ? '#ffffff' : '#1d1f20',\n        status: l.blocked ? 'Čeka operatera' : l.rotating ? 'Rotacija stola' : 'Radi · strana ' + (l.robotSide ? 'B' : 'A'),\n        produced: String(l.produced), uph: l.uph ? l.uph.toFixed(1) : '—', u1: pct(l.u1) + '%', u2: pct(l.u2) + '%', wait: fmt(l.waitOp).slice(3),\n        raw: l.raw + '/' + sn.cap, fin: l.fin + '/' + sn.cap };\n    }) : [];\n    const sl = (key, label, min, max, step, unit) => ({ label, min, max, step, value: p[key], display: p[key] + ' ' + unit, onChange: e => this.setParam(key, Number(e.target.value)) });\n    const ph = L ? L.phase : -1;\n    const flow = [\n      ['Stol', 'Sirovac sa štapa', 'hvat izvana (OD)'],\n      ['Pregrip', 'Prebacivanje na ID hvat', 'odlaganje, prsti ulaze u provrt'],\n      ['OP1', 'Steže izvana (OD)', 'obrada provrta i čela'],\n      ['Pregrip', 'Prebacivanje na OD hvat', 'druga strana komada ide prema alatu'],\n      ['OP2', 'Steže iznutra (ID) na trnu', 'obrada vanjskog promjera'],\n      ['Stol', 'Gotov komad na štap', 'hvat izvana (OD)'],\n    ].map(([where, title, sub], i) => {\n      const on = ph === i;\n      return { n: String(i + 1).padStart(2, '0'), where, title, sub, bg: on ? '#34536f' : 'transparent', fg: on ? '#ffffff' : '#1d1f20', kc: on ? '#c9d7e6' : '#34536f', sc: on ? '#e3e9f0' : '#4a4f54' };\n    });\n    return {\n      flow, rows, kpis,\n      isMob: mob, notMob: !mob,\n      pad: mob ? '14px 12px 28px' : '22px 28px 40px', gap: mob ? '12px' : '18px',\n      h1: mob ? '30px' : '44px', kpiFs: mob ? '34px' : '46px', kpiMin: mob ? '150px' : '190px', flowMin: mob ? '150px' : '170px',\n      hint3d: mob ? 'jedan prst = rotacija · dva prsta = zum/pomak' : 'povuci = rotacija · desni klik = pomak · scroll = zum',\n      r2d: this.r2d, r3d: this.r3d, rG: this.rG,\n      linesLabel: N + plural(N),\n      clock: fmt(sn && sn.t),\n      robotTag: 'Robot L' + (gl + 1),\n      task: L ? L.task : 'Učitavanje…',\n      opTask: sn ? sn.opLabel : '—',\n      playLabel: s.playing ? 'Pauza' : 'Pokreni',\n      togglePlay: () => this.setState({ playing: !s.playing }),\n      reset: () => this.resetWith(this.state.params || p),\n      speeds: [1, 5, 20, 60, 120].map(n => seg(s.speed === n, () => this.setState({ speed: n }), n + '×')),\n      views: [['3d', '3D prikaz'], ['2d', '2D tlocrt'], ['both', 'Oba']].map(([k, l]) => seg(s.view === k, () => this.setState({ view: k }), l)),\n      focusOpts: [-1].concat(Array.from({ length: N }, (_, i) => i)).map(i => seg(s.focus === i, () => this.setFocus(i), i < 0 ? 'Sve' : 'L' + (i + 1))),\n      toggleReach: () => this.setState({ showReach: !reach }),\n      reachBg: reach ? '#34536f' : 'transparent', reachFg: reach ? '#ffffff' : '#1d1f20',\n      presets: [['all', 'Cijela linija'], ['iso', 'Izometrija'], ['top', 'Odozgo'], ['op', 'Operater'], ['side', 'Bočno']].map(([k, l]) => ({ label: l, onClick: () => this.v3 && this.v3.preset(k, this.state.focus) })),\n      gridCols: s.view === 'both' ? 'repeat(auto-fit,minmax(min(100%,520px),1fr))' : 'minmax(0,1fr)',\n      d3: s.view === '2d' ? 'none' : 'flex', d2: s.view === '3d' ? 'none' : 'flex',\n      viewH: mob ? 'max(320px, 58vh)' : (s.view === 'both' ? '540px' : '640px'),\n      viewH2: mob ? Math.round(cw * (s.focus < 0 && N > 1 ? (N * 5.6 + 0.1) : 5.45) / 6.1) + 'px' : s.focus < 0 && N >= 3 && s.view !== 'both' ? (N >= 5 ? '360px' : '440px') : (s.view === 'both' ? '540px' : '640px'),\n      err: !!s.err, errText: s.err || '',\n      ganttLabel: 'L' + (gl + 1) + ' + operater · zadnjih ' + gm + ' min',\n      sliders: [\n        sl('op1', 'Ciklus OP1', 15, 180, 1, 's'),\n        sl('op2', 'Ciklus OP2', 15, 180, 1, 's'),\n        sl('speed', 'Brzina robota', 30, 150, 5, '%'),\n        sl('opTime', 'Operater po obruču', 1, 10, 0.5, 's'),\n        sl('paperT', 'Plavi papir po sloju', 1, 20, 1, 's'),\n        sl('basketT', 'Zamjena korpe', 0, 180, 5, 's'),\n        sl('rot', 'Rotacija stola 180°', 2, 12, 0.5, 's'),\n      ],\n      lineOpts: [1, 2, 3, 4, 5, 6].map(n => seg(p.lines === n, () => this.setParam('lines', n), String(n))),\n      layerOpts: [6, 8, 10].map(n => seg(p.layers === n, () => this.setParam('layers', n), String(n))),\n      pinOpts: [4, 6].map(n => seg(p.pins === n, () => this.setParam('pins', n), String(n))),\n      stackOpts: [6, 8, 10, 12, 15].map(n => seg(p.stack === n, () => this.setParam('stack', n), String(n))),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
